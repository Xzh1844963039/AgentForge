[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.6.0"
description = "A memory-evolving multi-agent collaborative platform with autonomous task delegation and sandboxed execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AgentForge Team" }]
keywords = ["multi-agent", "llm", "orchestration", "deepseek", "agents"]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "jsonschema>=4.21,<5",
    "python-dotenv>=1.0,<2",
    "rich>=13.7,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
agentforge = "agentforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "docker: requires a running Docker daemon with the configured image",
]

[tool.coverage.run]
source = ["agentforge"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
